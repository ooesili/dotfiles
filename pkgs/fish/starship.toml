"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
[](bg:color_bg1 fg:color_green)\
$directory\
[](fg:color_bg1 bg:color_aqua)\
$git_branch\
$git_status\
[](fg:color_aqua bg:color_red)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_red bg:color_bg3)\
$docker_context\
[](fg:color_bg3 bg:color_bg1)\
$time\
[ ](fg:color_bg1)\
$line_break$hostname$character"""

palette = 'base16-default-dark'

[palettes.base16-default-dark]
color_fg0 = '#d8d8d8'
color_bg1 = '#383838'
color_bg3 = '#585858'
color_blue = '#7cafc2'
color_aqua = '#86c1b9'
color_green = '#a1b56c'
color_orange = '#dc9656'
color_purple = '#ba8baf'
color_red = '#ab4642'
color_yellow = '#f7ca88'

[os]
disabled = false
style = "bg:color_green fg:color_bg1"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
NixOS = "󱄅"

[username]
show_always = true
style_user = "bg:color_green fg:color_bg1"
style_root = "bg:color_orange fg:color_bg1"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_bg1"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = "󰊢"
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_bg1 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_bg1 bg:color_aqua)]($style)'

[nodejs]
symbol = ""
style = "bg:color_red"
format = '[[ $symbol( $version) ](fg:color_bg1 bg:color_red)]($style)'

[c]
symbol = " "
style = "bg:color_red"
format = '[[ $symbol( $version) ](fg:color_bg1 bg:color_red)]($style)'

[rust]
symbol = ""
style = "bg:color_red"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_red)]($style)'

[golang]
symbol = ""
style = "bg:color_red"
format = '[[ $symbol( $version) ](fg:color_bg1 bg:color_red)]($style)'

[php]
symbol = ""
style = "bg:color_red"
format = '[[ $symbol( $version) ](fg:color_bg1 bg:color_red)]($style)'

[java]
symbol = " "
style = "bg:color_red"
format = '[[ $symbol( $version) ](fg:color_bg1 bg:color_red)]($style)'

[kotlin]
symbol = ""
style = "bg:color_red"
format = '[[ $symbol( $version) ](fg:color_bg1 bg:color_red)]($style)'

[haskell]
symbol = ""
style = "bg:color_red"
format = '[[ $symbol( $version) ](fg:color_bg1 bg:color_red)]($style)'

[python]
symbol = ""
style = "bg:color_red"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_red)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[hostname]
ssh_only = true
format = '[$hostname]($style) '
style = 'fg:color_green'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[󱄅 ❯](bold fg:color_green)'
error_symbol = '[󱄅 ❯](bold fg:color_red)'
vimcmd_symbol = '[󱄅 ❯](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_bg1)'
