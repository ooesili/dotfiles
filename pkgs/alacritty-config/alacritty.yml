font:
  normal:
    family: Hack
  bold:
    family: Hack
  italic:
    family: Hack
  size: @fontSize@

  # Alacritty in nixos-21.05 "estimates" an extra pixel in the cell size so we
  # adjust for it here.
  offset:
    y: -1

key_bindings:
- { key: I, mods: Super|Shift, chars: "" }
@extraKeyBindings@

window:
  padding:
    x: 2
    y: 2

scrolling:
  history: 10000

# Colors (Base16 Default Dark)
colors:
  # Default colors
  primary:
    background: '0x181818'
    foreground: '0xd8d8d8'

  # Cursor colors
  #
  # Colors which should be used to draw the terminal cursor. If these are unset,
  # the cursor color will be the inverse of the cell color.
  cursor:
    text: '0x181818'
    cursor: '0xd8d8d8'

  # Normal colors
  normal:
    black:   '0x181818'
    red:     '0xab4642'
    green:   '0xa1b56c'
    yellow:  '0xf7ca88'
    blue:    '0x7cafc2'
    magenta: '0xba8baf'
    cyan:    '0x86c1b9'
    white:   '0xd8d8d8'

  # Bright colors
  bright:
    black:   '0x585858'
    red:     '0xdc9656'
    green:   '0x282828'
    yellow:  '0x383838'
    blue:    '0xb8b8b8'
    magenta: '0xe8e8e8'
    cyan:    '0xa16946'
    white:   '0xf8f8f8'
