[font]
size = @fontSize@

[font.bold]
family = "Hack Nerd Font"

[font.italic]
family = "Hack Nerd Font"

[font.normal]
family = "Hack Nerd Font"

[[keyboard.bindings]]
chars = ""
key = "I"
mods = "Super|Shift"

# send <C-;> through to neovim via tmux's "extended-keys" option
[[keyboard.bindings]]
key = ";"
mods = "Control"
chars = "\u001b[59;5u"

[scrolling]
history = 10000

[window.padding]
x = 2
y = 2
