#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
# framework
monitor=eDP-1 ,highres, auto, 1.333333
# nixbox
monitor=DP-3,     1920x1080, 0x0,   1
monitor=HDMI-A-1, 1920x1080, 1920x0,1

xwayland {
    force_zero_scaling = true
}

env = GDK_SCALE,1


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP & systemctl --user start graphical-session.target
exec-once = dbus-update-activation-environment --systemd --all & systemctl --user start hyprland.target

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
env = XCURSOR_SIZE,24

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    repeat_rate = 30
    repeat_delay = 175
    follow_mouse = 1

    touchpad {
        natural_scroll = no
        scroll_factor = 0.3
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_on_top = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = true
    workspace_swipe_invert = true
}

# group {
#   groupbar {
#     font_size = 10
#   }
# }

misc {
    disable_hyprland_logo = true
    # force_default_wallpaper = 0
}

cursor {
  inactive_timeout = 5
}

render {
  explicit_sync = 0
  explicit_sync_kms = 0
}

# Window rules
windowrulev2 = workspace 1, title:(Spotify)
windowrulev2 = workspace 2, class:(discord)
windowrulev2 = workspace 2, class:(Slack)
windowrulev2 = workspace 2, class:(org\.telegram\.desktop)
windowrulev2 = workspace special, class:(obsidian)
windowrulev2 = pseudo, class:(obsidian)


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, alacritty
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, M, exec, wlogout
bind = $mainMod SHIFT, V, togglefloating,down
bind = $mainMod, D, exec, wofi --show run
bind = $mainMod, A, exec, wofi --show drun
bind = $mainMod, W, exec, wofi-windows
bind = $mainMod, escape, exec, lock-now

# Dwindle
bind = $mainMod, P, pseudo
bind = $mainMod, E, togglesplit
bind = $mainMod, G, togglegroup
bind = $mainMod SHIFT, G, lockgroups, toggle
bind = $mainMod, tab, changegroupactive, f
bind = $mainMod SHIFT, tab, changegroupactive, b
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, F, fullscreen, 1

# media controls
bind = $mainMod, Z, exec, playerctl previous --ignore-player=firefox
bind = $mainMod, X, exec, playerctl play --ignore-player=firefox
bind = $mainMod, C, exec, playerctl pause --ignore-player=firefox
bind = $mainMod, V, exec, playerctl stop --ignore-player=firefox
bind = $mainMod, B, exec, playerctl next --ignore-player=firefox
binde = , XF86MonBrightnessUp, exec, brightnessctl set +1%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 1%-
binde = , XF86AudioMute, exec, pamixer --toggle-mute
binde = , XF86AudioLowerVolume, exec, pamixer --decrease 2
binde = , XF86AudioRaiseVolume, exec, pamixer --increase 2

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# scratchpad
bind = $mainMod, 0, togglespecialworkspace
bind = $mainMod SHIFT, 0, movetoworkspace, special

# move windows
bind = $mainMod SHIFT, H, movewindoworgroup, l
bind = $mainMod SHIFT, L, movewindoworgroup, r
bind = $mainMod SHIFT, K, movewindoworgroup, u
bind = $mainMod SHIFT, J, movewindoworgroup, d

# move workspaces
bind = $mainMod CONTROL SHIFT, H, movecurrentworkspacetomonitor, l
bind = $mainMod CONTROL SHIFT, L, movecurrentworkspacetomonitor, r
bind = $mainMod CONTROL SHIFT, K, movecurrentworkspacetomonitor, u
bind = $mainMod CONTROL SHIFT, J, movecurrentworkspacetomonitor, d
#

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# resizing
binde=$mainMod CONTROL, l, resizeactive, 30 0
binde=$mainMod CONTROL, h, resizeactive, -30 0
binde=$mainMod CONTROL, k, resizeactive, 0 -30
binde=$mainMod CONTROL, j, resizeactive, 0 30
