### Variables
#
# Logo key. Use Mod1 for Alt.
set $mod Mod4
# Home row direction keys, like vim
set $left h
set $down j
set $up k
set $right l

### Appearance
#
# Font for window titles. Will also be used by the bar unless a different font
# is used in the bar {} block below.
font pango:Hack Nerd Font 9

# Colors
include theme-base16-default-dark

# window corner radius in px
corner_radius 1

shadows enable
shadows_on_csd off
shadow_blur_radius 20
shadow_color #0000007F

# Decorations
hide_edge_borders smart

# Window background blur
blur enable
blur_xray off
blur_passes 2
blur_radius 10
# Move minimized windows into Scratchpad (enable|disable)
scratchpad_minimize disable

gaps inner 10

### Output configuration
#
# You can get the names of your outputs by running: swaymsg -t get_outputs
output * {
  bg /home/ooesili/images/wallpapers/5367704698_ec14081c6b_o.jpg fill
}

output eDP-1 {
  scale 1.5
  adaptive_sync on
  pos 0 1440
}

output DP-1 {
  mode 3840x2160@30Hz
  pos 0 0
}

### Input configuration
#
# You can get the names of your inputs by running: swaymsg -t get_inputs
# Read `man 5 sway-input` for more information about this section.
input * {
  repeat_rate 30
  repeat_delay 180
}

input "2362:628:PIXA3854:00_093A:0274_Touchpad" {
  scroll_factor 0.2
}

input type:touchpad {
  tap enabled
  dwt enabled
}

### Seat configuration
seat seat0 {
  hide_cursor when-typing enable
  xcursor_theme Adwaita 24
}

### Basic keybindings
#
# Launch programs
bindsym $mod+Return exec alacritty
bindsym $mod+Shift+Return exec alacritty --class='Alacritty.float' --command tmux new -A -s scratch
bindsym $mod+Escape exec lock-now

# Device controls
bindsym XF86AudioMute exec --no-startup-id pamixer --toggle-mute
bindsym XF86AudioLowerVolume exec --no-startup-id pamixer --decrease 2
bindsym XF86AudioRaiseVolume exec --no-startup-id pamixer --increase 2
bindsym XF86MonBrightnessUp exec --no-startup-id brightnessctl set +3%
bindsym XF86MonBrightnessDown exec --no-startup-id brightnessctl --min-value=1 set 3%-

# Media controls
bindsym $mod+z exec --no-startup-id playerctl previous --ignore-player=firefox
bindsym $mod+x exec --no-startup-id playerctl play --ignore-player=firefox
bindsym $mod+c exec --no-startup-id playerctl pause --ignore-player=firefox
bindsym $mod+v exec --no-startup-id playerctl stop --ignore-player=firefox
bindsym $mod+b exec --no-startup-id playerctl next --ignore-player=firefox
bindsym XF86AudioPlay exec --no-startup-id playerctl play --ignore-player=firefox
bindsym XF86AudioPause exec --no-startup-id playerctl pause --ignore-player=firefox
bindsym XF86AudioNext exec --no-startup-id playerctl next --ignore-player=firefox
bindsym XF86AudioPrev exec --no-startup-id playerctl previous --ignore-player=firefox

# Kill focused window
bindsym $mod+Shift+q kill

# Start your launcher
# Note: piping to `xargs swaymsg` allows the window to be opened on the original
# workspace that the command was run on.
bindsym $mod+d exec fuzzel --launch-prefix='swaymsg exec --'
bindsym $mod+Shift+d exec sway-windows | fuzzel --dmenu --with-nth=2 --accept-nth=1 --mesg='focus window' --prompt ' ' | xargs -I{} swaymsg '[con_id={}]' focus

# Drag floating windows by holding down $mod and left mouse button.
# Resize them with right mouse button + $mod.
# Despite the name, also works for non-floating windows.
# Change normal to inverse to use left mouse button for resizing and right
# mouse button for dragging.
floating_modifier $mod normal

# Reload the configuration file
bindsym $mod+Shift+c reload

# Exit sway (logs you out of your Wayland session)
bindsym $mod+Shift+e exec swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' -B 'Yes, exit sway' 'swaymsg exit'

# Open logout prompt
bindsym $mod+m exec wlogout

# Moving around:
#
# Move your focus around
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right
# Or use $mod+[up|down|left|right]
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Move the focused window with the same, but add Shift
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right
# Ditto, with arrow keys
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# Workspaces
#
# Switch to workspace
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10
# Move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# Layout stuff:
#
# You can "split" the current object of your focus with
# $mod+b or $mod+v, for horizontal and vertical splits
# respectively.
# split in horizontal orientation
bindsym $mod+o split h
# split in vertical orientation
bindsym $mod+u split v
# enter fullscreen mode for the focused container

# Switch the current container between different layout styles
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split

# Make the current focus fullscreen
bindsym $mod+f fullscreen

# Toggle the current focus between tiling and floating mode
bindsym $mod+Shift+space floating toggle

# Swap focus between the tiling area and the floating area
bindsym $mod+space focus mode_toggle

# Move focus to the parent container
bindsym $mod+a focus parent
bindsym $mod+Shift+a focus child

# Focus unsplit and move child to parent
bindsym $mod+p split none

# move between monitors
bindsym $mod+Control+$left move container to output left
bindsym $mod+Control+$down move container to output down
bindsym $mod+Control+$up move container to output up
bindsym $mod+Control+$right move container to output right
bindsym $mod+Control+Shift+$left move workspace to output left
bindsym $mod+Control+Shift+$down move workspace to output down
bindsym $mod+Control+Shift+$up move workspace to output up
bindsym $mod+Control+Shift+$right move workspace to output right

### Scratchpad
#
# Sway has a "scratchpad", which is a bag of holding for windows.
# You can send windows there and get them back later.

# Move the currently focused window to the scratchpad
bindsym $mod+Shift+minus move scratchpad

# Show the next scratchpad window or hide the focused scratchpad window.
# If there are multiple scratchpad windows, this command cycles through them.
bindsym $mod+minus scratchpad show

### Resizing containers
mode "resize" {
    # left will shrink the containers width
    # right will grow the containers width
    # up will shrink the containers height
    # down will grow the containers height
    bindsym $left resize shrink width 10px
    bindsym $down resize grow height 10px
    bindsym $up resize shrink height 10px
    bindsym $right resize grow width 10px

    # Ditto, with arrow keys
    bindsym Left resize shrink width 10px
    bindsym Down resize grow height 10px
    bindsym Up resize shrink height 10px
    bindsym Right resize grow width 10px

    # Return to default mode
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"

# # disable so that we can use xwayland-satellite instead
# xwayland disable

### Application Settings
for_window [class="QjackCtl"] floating enable
for_window [class="VirtualBox Machine"] floating enable
for_window [class="Pavucontrol"] floating enable
for_window [title="^Steam - News .*"] floating enable
for_window [app_id="Alacritty.float"] floating enable
for_window [app_id="org.pulseaudio.pavucontrol"] floating enable
for_window [app_id="show-file-dialog-gtk3"] floating enable

# Don't automatically move the mouse when switching monitors.
mouse_warping none

set $system_theme 'Arc-Dark'
set $system_icons 'Numix-Square'
set $system_dpi_scaling_factor 1.0
set $cursor_size 24
set $cursor_theme Adwaita
set $titlebar_text_size 32
set $titlebar_font Cantarell

# GTK
# This is the only place where you must set GTK scaling
set $gnome-schema org.gnome.desktop.interface
exec_always {
  # gsettings set $gnome-schema gtk-theme $system_theme
  # gsettings set $gnome-schema icon-theme $system_icons
  # gsettings set $gnome-schema text-scaling-factor $system_dpi_scaling_factor
  gsettings set $gnome-schema cursor-theme $cursor_theme
  gsettings set $gnome-schema cursor-size $cursor_size
}

# Mouse
seat seat0 xcursor_theme $cursor_theme $cursor_size

include /etc/sway/config.d/*

